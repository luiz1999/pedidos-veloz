        # ✅ securityContext em todos os serviços
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos-svc
  namespace: pedidos-veloz
spec:
  selector:
    app: pagamentos
  ports:
  - port: 3002
    targetPort: 3002

---
# Serviço de Estoque
apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque
  namespace: pedidos-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estoque
  strategy:
    type: RollingUpdate
    rollingUpdate:
