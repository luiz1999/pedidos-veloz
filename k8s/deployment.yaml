apiVersion: v1
kind: Namespace
metadata:
  name: pedidos-veloz

---
# ✅ MUDANÇA 1: Secret separado para dados sensíveis (senha do banco)
# Antes estava no ConfigMap — senha em ConfigMap é errado!
apiVersion: v1
kind: Secret
metadata:
  name: pedidos-secret
  namespace: pedidos-veloz
type: Opaque
stringData:
  DB_USER: "pvuser"
  DB_PASSWORD: "pvsenha"

---
# ConfigMap só com dados NÃO sensíveis
# ✅ MUDANÇA: removeu DB_USER e DB_PASSWORD daqui
apiVersion: v1
kind: ConfigMap
metadata:
  name: pedidos-config
  namespace: pedidos-veloz
data:
  DB_HOST: "postgres"
  DB_NAME: "pedidosveloz"
  DB_PORT: "5432"

---
# PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pedidos-veloz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "pvuser"
        - name: POSTGRES_PASSWORD
          value: "pvsenha"
        - name: POSTGRES_DB
          value: "pedidosveloz"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pedidos-veloz
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# Serviço de Pedidos
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: pedidos-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
      - name: pedidos
        image: pedidos-veloz-pedidos:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        # ✅ MUDANÇA 2: puxa ConfigMap E Secret juntos
        envFrom:
        - configMapRef:
            name: pedidos-config   # DB_HOST, DB_NAME, DB_PORT
        - secretRef:
            name: pedidos-secret   # DB_USER, DB_PASSWORD
        # ✅ MUDANÇA 3: segurança — roda sem privilégios de root
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-svc
  namespace: pedidos-veloz
spec:
  selector:
    app: pedidos
  ports:
  - port: 3001
    targetPort: 3001

---
# Serviço de Pagamentos
apiVersion: apps/v1
